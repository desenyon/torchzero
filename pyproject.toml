[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "torchzero"
version = "0.1.0"
description = "A neural network and transformer stack built without PyTorch, TensorFlow, JAX, or any autodiff framework."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "TorchZero contributors" }]
dependencies = [
    # numpy is the ONLY external numerical dependency.
    # It is used strictly as a low-level array storage + primitive kernel backend
    # (elementwise math, matmul, reductions). TorchZero implements its own tensor
    # abstraction, computation graph, reverse-mode autodiff, module system,
    # optimizers, transformer, training runtime, and checkpointing on top of it.
    "numpy>=1.24",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
]
figures = [
    # Used only by scripts/generate_figures.py to render research plots from raw
    # experiment results. Never imported by torchzero runtime code.
    "matplotlib>=3.7",
]

[project.scripts]
torchzero = "torchzero.cli.main:main"

[tool.setuptools.packages.find]
include = ["torchzero*", "debugger*", "benchmarks*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
