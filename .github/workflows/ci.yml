name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.13"]
    env:
      OPENBLAS_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - run: python -m pip install -e ".[dev]"
      - run: python -m pytest
      - run: python -m ruff check .
      - run: python -m compileall -q torchzero debugger benchmarks
      - run: python -m build
      - name: Test source distribution
        run: |
          mkdir "${{ runner.temp }}/source"
          tar -xzf dist/torchzero-*.tar.gz -C "${{ runner.temp }}/source"
          cd "${{ runner.temp }}"/source/torchzero-*
          python -m pytest
      - name: Install wheel and smoke test outside checkout
        run: |
          python -m pip uninstall -y torchzero
          python -m pip install --no-deps dist/*.whl
          cd "${{ runner.temp }}"
          torchzero --help
          torchzero train "${{ github.workspace }}/configs/tiny.yaml" --stop-after 2
          torchzero train "${{ github.workspace }}/configs/tiny.yaml" --resume checkpoints/tiny/final.pkl --stop-after 3
          torchzero generate checkpoints/tiny "the sun" --tokens 3 --temperature 0
          torchzero inspect checkpoints/tiny "the sun" --html report.html
