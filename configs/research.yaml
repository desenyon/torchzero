# Larger research configuration for meaningful experiments (still CPU-scale).
out_dir: checkpoints/research

model:
  vocab_size: auto
  dim: 128
  n_layers: 4
  n_heads: 4
  block_size: 128

data:
  text: null              # replace with a path to a .txt corpus for real runs
  val_fraction: 0.25      # use a smaller fraction with a larger external corpus

train:
  optimizer: adamw
  lr: 3.0e-3
  weight_decay: 0.01
  grad_clip: 1.0
  batch_size: 16
  max_steps: 2000
  warmup_steps: 100
  min_lr_ratio: 0.1
  eval_every: 100
  ckpt_every: 250
  log_every: 25
  seed: 0
